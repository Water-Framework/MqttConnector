#
# MQTT connector default runtime configuration
#
# Environment variables:
# - WATER_MQTT_BROKER_URL: broker url, e.g. tcp://localhost:1883 (default: empty -> connector disabled)
# - WATER_MQTT_CLIENT_ID: MQTT client id (default: water-mqtt-<it.water.node.id>); must be unique per broker
# - WATER_MQTT_USERNAME / WATER_MQTT_PASSWORD: credentials (no default; password is mandatory if username is set)
# - WATER_MQTT_CLEAN_SESSION: broker forgets subscriptions on disconnect (default: true)
# - WATER_MQTT_DEFAULT_QOS: qos used for subscribe and default publish (default: 1)
# - WATER_MQTT_RECONNECT_DELAY_MS: delay between first-connect retries (default: 5000)
# - WATER_MQTT_DISPATCH_THREADS: threads delivering messages to receivers (default: 1, keeps ordering)
#
# NOTE: broker.url, client.id, username and password are intentionally NOT defined here.
# The ${env:NAME:-default} syntax does not support an EMPTY default (the Water ENV_PATTERN needs at
# least one character), so an empty default would be read as the literal unresolved text.
# When missing, the connector treats them as empty: no broker url = connector disabled.
# Set them in the application properties of the app, e.g.:
#   it.water.connectors.mqtt.broker.url=${env:WATER_MQTT_BROKER_URL}
it.water.connectors.mqtt.clean.session=${env:WATER_MQTT_CLEAN_SESSION:-true}
it.water.connectors.mqtt.default.qos=${env:WATER_MQTT_DEFAULT_QOS:-1}
it.water.connectors.mqtt.reconnect.delay.ms=${env:WATER_MQTT_RECONNECT_DELAY_MS:-5000}
it.water.connectors.mqtt.dispatch.threads=${env:WATER_MQTT_DISPATCH_THREADS:-1}
